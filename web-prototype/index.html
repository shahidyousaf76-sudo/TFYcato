<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>TFY Cat Adventure</title>
<style>
  :root { --purple:#6C4AB6; --pink:#FF5DA2; --orange:#FF9F1C; --green:#2EC4B6; --blue:#3A86FF; --yellow:#FFD23F; --dark:#2B2D42; --light:#FFF8F0; --grey:#9A9AB0; --red:#EF476F; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2A1B5C; font-family: "Baloo 2", "Trebuchet MS", "Segoe UI Rounded", ui-rounded, system-ui, sans-serif; color: #fff; touch-action: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .screen.on { display: block; }
  .screen.center.on { display: flex; }
  .screen:not(.on) { display: none !important; }
  .solid { background: linear-gradient(160deg, #7b55d6, #4b2f9a); }
  .glass { background: rgba(35, 20, 80, 0.86); overflow-y: auto; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  h1 { font-size: clamp(30px, 7vw, 54px); margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.25); letter-spacing: .5px; }
  h2 { font-size: clamp(22px, 5vw, 34px); margin: 0; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .btn { border: 0; border-radius: 22px; padding: 14px 22px; font: inherit; font-weight: 800; font-size: 20px; color: #fff; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.22); transition: transform .08s; background: var(--purple); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .btn:active { transform: translateY(4px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .btn:disabled { opacity: .5; }
  .btn.green { background: var(--green); } .btn.pink { background: var(--pink); } .btn.orange { background: var(--orange); } .btn.blue { background: var(--blue); } .btn.grey { background: var(--grey); } .btn.red { background: var(--red); } .btn.yellow { background: var(--yellow); color: var(--dark); }
  .btn.big { font-size: clamp(28px, 7vw, 44px); padding: 18px 40px; border-radius: 30px; }
  .pill { background: rgba(0,0,0,.35); border-radius: 30px; padding: 6px 14px; font-weight: 800; font-size: 20px; display: inline-flex; align-items: center; gap: 6px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .header .btn { width: 56px; height: 56px; padding: 0; font-size: 26px; }
  #logo { width: min(78vw, 360px); aspect-ratio: 1; display: grid; place-items: center; animation: pop .6s cubic-bezier(.3,1.5,.5,1) both; filter: drop-shadow(0 10px 12px rgba(0,0,0,.3)); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .logo-small { width: min(46vw, 210px); filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  #logo img { width: 100%; height: 100%; object-fit: contain; }
  .bar { width: min(420px, 80vw); height: 22px; border-radius: 12px; background: rgba(0,0,0,.3); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 12px; transition: width .2s; }
  .bounce { animation: bounce .6s infinite alternate ease-in-out; font-size: 84px; }
  @keyframes bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-24px) rotate(6deg); } }
  #home .menu { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, 94vw); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #home .menu .btn { font-size: 15px; padding: 12px 6px; flex-direction: column; gap: 4px; position: relative; }
  #home .menu .btn b { font-size: 28px; }
  #home .play { position: absolute; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 170px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #home .title { text-align: center; margin-top: 10px; }
  .home-logo { width: min(44vw, 190px); display: block; margin: -6px auto 0; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  #hello { color: var(--yellow); font-size: 26px; font-weight: 800; margin-top: 4px; }
  .dot { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 3px solid #fff; display: none; }
  .banner { background: rgba(255,255,255,.9); color: var(--dark); border-radius: 16px; padding: 8px 14px; margin: 10px auto 0; max-width: 560px; font-weight: 700; display: none; text-align: center; }
  .list { display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
  .world { border-radius: 18px; padding: 10px 14px; font-weight: 800; font-size: 22px; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .levels { display: flex; gap: 12px; flex-wrap: wrap; }
  .lvl { width: 110px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lvl .btn { width: 100px; height: 100px; font-size: 40px; border-radius: 26px; }
  .stars { font-size: 20px; letter-spacing: 2px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .tabs .btn { font-size: 14px; padding: 10px 12px; border-radius: 14px; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .item { background: #fff; color: var(--dark); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-weight: 700; cursor: pointer; }
  .item.sel { outline: 5px solid var(--yellow); }
  .swatch { width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; }
  .item .btn { width: 100%; font-size: 15px; padding: 9px; border-radius: 14px; }
  .muted { color: rgba(255,255,255,.7); }
  .row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.1); border-radius: 18px; padding: 10px 14px; }
  .row .grow { flex: 1; }
  .ach { background: #fff; color: var(--dark); }
  .ach.done { background: #FFE8A3; }
  .progress { height: 10px; background: rgba(0,0,0,.12); border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .progress i { display: block; height: 100%; background: var(--blue); }
  .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 560px; margin: 10px auto; }
  .day { background: #fff; color: var(--dark); border-radius: 16px; padding: 8px 4px; text-align: center; font-weight: 800; font-size: 14px; }
  .day.today { background: var(--yellow); } .day.past { background: #B8F2E6; }
  .day b { display: block; font-size: 30px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg .btn { font-size: 15px; padding: 10px 14px; }
  /* HUD */
  #hud { pointer-events: none; }
  #hud .btn, #hud .ctl { pointer-events: auto; }
  #hearts { font-size: 34px; letter-spacing: 2px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  .counters { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #pauseBtn { width: 60px; height: 60px; padding: 0; font-size: 26px; background: rgba(0,0,0,.35); }
  #track { position: absolute; left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(36vw, 320px); height: 14px; border-radius: 8px; background: rgba(0,0,0,.3); }
  #track > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yellow); border-radius: 8px; }
  #track .flag { position: absolute; top: -14px; font-size: 18px; transform: translateX(-50%); }
  #powers { display: flex; gap: 8px; margin-top: 10px; }
  .pw { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(0,0,0,.35) 0); }
  #prompt { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); background: rgba(20,10,50,.6); border-radius: 30px; padding: 18px 28px; text-align: center; display: none; }
  #prompt .hand { font-size: 64px; animation: bounce .5s infinite alternate; }
  #prompt .txt { color: var(--yellow); font-size: clamp(26px, 6vw, 40px); font-weight: 900; }
  #bannerHud { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); background: rgba(46,196,182,.92); border-radius: 30px; padding: 12px 28px; font-size: clamp(26px, 6vw, 42px); font-weight: 900; display: none; }
  #ctls { position: absolute; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #ctls .btn { background: rgba(255,255,255,.25); font-size: 34px; height: 80px; }
  .card { background: var(--light); color: var(--dark); border-radius: 34px; padding: 22px; width: min(520px, 94vw); box-shadow: 0 12px 0 rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 12px; }
  .card h1 { color: var(--orange); text-shadow: none; }
  .bigstars { font-size: 64px; letter-spacing: 6px; }
  .bigstars span { display: inline-block; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); filter: grayscale(1) opacity(.35); }
  .bigstars span.on { filter: none; }
  .bigstars span.show { transform: scale(1); }
  .stat { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; }
  .notes { color: var(--purple); font-weight: 700; }
  #toast { position: fixed; left: 50%; top: max(90px, calc(env(safe-area-inset-top) + 70px)); transform: translateX(-50%); background: rgba(40,25,80,.94); padding: 12px 20px; border-radius: 22px; font-weight: 800; font-size: 18px; max-width: 90vw; text-align: center; display: none; z-index: 20; }
  #dialog { z-index: 30; background: rgba(0,0,0,.55); }
  input[type=range] { width: 100%; }
  a { color: var(--yellow); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="splash" class="screen solid center"><div id="logo"><img src="assets/tfy-logo.png" alt="TFY CATO"></div><h2 class="muted">presents</h2></div>

<div id="loading" class="screen solid center">
  <img class="logo-small" src="assets/tfy-logo.png" alt="TFY CATO">
  <div class="bounce">🐱</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="tip" style="font-size:20px;font-weight:700;max-width:520px"></div>
</div>

<div id="home" class="screen">
  <div class="top"><div><span class="pill">🪙 <span id="hCoins">0</span></span> <span class="pill">💎 <span id="hGems">0</span></span></div><span class="pill" id="hOnline">offline demo</span></div>
  <div class="title"><img class="home-logo" src="assets/tfy-logo.png" alt="TFY CATO"><div id="hello"></div></div>
  <div class="banner" id="hBanner"></div>
  <div class="play"><button class="btn green big" id="playBtn">▶ PLAY</button><div class="pill" id="playLevel">Level 1</div></div>
  <div class="menu">
    <button class="btn pink" data-go="shop"><b>🛒</b>CAT SHOP</button>
    <button class="btn blue" data-go="levels"><b>🚩</b>LEVELS</button>
    <button class="btn orange" data-go="rewards"><b>🎁</b>REWARDS<i class="dot" id="rewardsDot"></i></button>
    <button class="btn" data-go="achievements"><b>🏆</b>ACHIEVEMENTS</button>
    <button class="btn grey" data-go="settings"><b>⚙️</b>SETTINGS</button>
    <button class="btn yellow" id="helpBtn"><b>❓</b>HOW TO PLAY</button>
  </div>
</div>

<div id="levels" class="screen glass"><div class="header"><button class="btn" data-go="home">◀</button><h2>LEVELS</h2></div><div class="list" id="levelList"></div></div>

<div id="shop" class="screen">
  <div class="header"><button class="btn" data-go="home">◀</button><h2>CAT SHOP</h2><span class="pill">🪙 <span id="sCoins">0</span></span><span class="pill">💎 <span id="sGems">0</span></span></div>
  <div style="position:absolute;left:16px;right:16px;bottom:16px;max-height:52vh;display:flex;flex-direction:column;gap:8px;">
    <div id="shopInfo" style="text-align:center;font-weight:800;min-height:24px;text-shadow:0 2px 0 rgba(0,0,0,.4)"></div>
    <div class="tabs" id="shopTabs"></div>
    <div class="grid glass" id="shopGrid" style="border-radius:22px;padding:10px;overflow-y:auto"></div>
  </div>
</div>

<div id="achievements" class="screen glass"><div class="header"><button class="btn" data-go="home">◀</button><h2>ACHIEVEMENTS</h2></div><div class="list" id="achList"></div></div>

<div id="rewards" class="screen glass">
  <div class="header"><button class="btn" data-go="home">◀</button><h2>REWARDS</h2></div>
  <div class="list" style="align-items:center;text-align:center">
    <h2 style="color:var(--yellow)">Daily Treats</h2>
    <div class="days" id="days"></div>
    <div id="dailyStatus" style="font-weight:700"></div>
    <button class="btn green big" id="claimBtn">🎁 OPEN</button>
    <h2 style="color:var(--yellow);margin-top:20px" id="boxTitle">Mystery Boxes</h2>
    <div style="font-size:80px">🎁</div>
    <button class="btn pink big" id="openBoxBtn">OPEN BOX</button>
  </div>
</div>

<div id="settings" class="screen glass"><div class="header"><button class="btn" data-go="home">◀</button><h2>SETTINGS</h2></div><div class="list" id="setList"></div></div>

<div id="hud" class="screen">
  <div class="top" style="align-items:flex-start">
    <div><div id="hearts"></div><div id="powers"></div></div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="counters"><span class="pill">⭐ <span id="uStars">0/3</span></span><span class="pill">🪙 <span id="uCoins">0</span></span><span class="pill">🐟 <span id="uFish">0</span></span><span class="pill" id="uGemsPill" style="display:none">💎 <span id="uGems">0</span></span></div>
      <button class="btn" id="pauseBtn">⏸</button>
    </div>
  </div>
  <div id="track"><i id="trackFill"></i></div>
  <div id="prompt"><div class="hand" id="promptHand">👆</div><div class="txt" id="promptText"></div></div>
  <div id="bannerHud"></div>
  <div id="ctls"><button class="btn ctl" data-in="left">⬅</button><button class="btn ctl" data-in="tap">⤒</button><button class="btn ctl" data-in="down">⤓</button><button class="btn ctl" data-in="right">➡</button></div>
</div>

<div id="pause" class="screen center" style="background:rgba(20,10,50,.75)">
  <h1>PAUSED</h1>
  <button class="btn green big" id="resumeBtn">▶ RESUME</button>
  <button class="btn orange" id="restartBtn">RESTART</button>
  <button class="btn" id="pauseHomeBtn">HOME</button>
</div>

<div id="complete" class="screen center" style="background:rgba(20,10,50,.5)">
  <div class="card">
    <h1>LEVEL COMPLETE!</h1>
    <div class="bigstars" id="bigStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="stat"><span>🪙 Coins</span><span id="cCoins"></span></div>
    <div class="stat"><span>🐟 Fish</span><span id="cFish"></span></div>
    <div class="stat"><span>💎 Gems</span><span id="cGems"></span></div>
    <div class="stat"><span>🏆 Score</span><span id="cScore"></span></div>
    <div class="stat"><span>⭐ Best</span><span id="cBest"></span></div>
    <div class="notes" id="cNotes"></div>
    <button class="btn green big" id="nextBtn">NEXT LEVEL ▶</button>
    <div style="display:flex;gap:10px"><button class="btn orange" style="flex:1" id="replayBtn">REPLAY</button><button class="btn" style="flex:1" id="cHomeBtn">HOME</button></div>
  </div>
</div>

<div id="fail" class="screen center" style="background:rgba(20,10,50,.6)">
  <div class="card" style="align-items:center">
    <h1 style="color:var(--pink)">Oops! Try again!</h1>
    <div style="font-size:80px">😿</div>
    <button class="btn green big" id="flagBtn" style="width:100%">🚩 FROM FLAG</button>
    <button class="btn orange" id="againBtn" style="width:100%">START OVER</button>
    <button class="btn" id="fHomeBtn" style="width:100%">HOME</button>
  </div>
</div>

<div id="dialog" class="screen center"><div class="card" style="align-items:center;text-align:center"><div id="dlgText" style="font-size:22px;font-weight:800;white-space:pre-line"></div><div style="display:flex;gap:10px;width:100%" id="dlgBtns"></div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Post-processing for bloom (r128 examples; the game still renders without them) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="content.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/landmarks.js"></script>
<script src="js/game.js"></script>
</body>
</html>
